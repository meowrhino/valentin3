name: Generar manifest.json

# Cuando el cliente sube o borra fotos en _PROJECTS/ (desde la web de GitHub),
# regeneramos manifest.json automáticamente y lo commiteamos si cambió.
on:
  push:
    branches: [main]
    paths:
      - '_PROJECTS/**'

# El workflow necesita poder commitear el manifest de vuelta al repo.
permissions:
  contents: write

# Evita solapar ejecuciones si llegan varios pushes seguidos.
concurrency:
  group: manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar manifest.json
        run: node scripts/build-manifest.mjs

      - name: Commitear si cambió
        run: |
          if git diff --quiet -- manifest.json; then
            echo "manifest.json sin cambios; nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          # [skip ci] evita que este commit re-dispare workflows (defensa extra;
          # el trigger ya filtra por _PROJECTS/**, que este commit no toca).
          git commit -m "chore: regenera manifest.json [skip ci]"
          git push
